<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15131A">
<title>Weird Wrestling Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15131A;
    --bg-raised:#1E1B24;
    --card:#F4EFE1;
    --ink:#1B1A22;
    --paper:#F4EFE1;
    --paper-dim:#C9C2AE;
    --line: rgba(244,239,225,0.25);
    --schlaege:#D8362A;
    --wuerfe:#2E6E9E;
    --submission:#7A4FA0;
    --flug:#3E8E62;
    --doubleteam:#E8A63A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 14px);
    color:var(--paper);
    font-family:'Barlow', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    margin:0;
  }
  a{color:inherit;}
  button, select, input{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--doubleteam); outline-offset:2px; }
  .hidden{ display:none !important; }

  /* ---------- Kopfbereich ---------- */
  header.masthead{ padding: 2.2rem 1.5rem 0; text-align:center; position:relative; }
  .countdown-badge{
    position:absolute; top:0; right:1.5rem;
    background:var(--doubleteam); color:var(--ink);
    font-family:'Anton', sans-serif; text-transform:uppercase;
    font-size:0.85rem; line-height:1.25; padding:0.5rem 0.8rem;
    border-radius:2px; text-align:center; white-space:nowrap;
  }
  @media (max-width: 640px){
    header.masthead{ padding-top:1.4rem; }
    .countdown-badge{ position:static; display:inline-block; margin-bottom:0.8rem; }
  }
  header.masthead h1{
    font-size:clamp(2.2rem, 7vw, 4.4rem);
    text-transform:uppercase;
    line-height:0.95;
    color:var(--paper);
    text-shadow: 3px 3px 0 var(--schlaege);
  }
  .rope-bars{ display:flex; margin-top:1.6rem; height:6px; }
  .rope-bars span{ flex:1; }
  .rope-bars span:nth-child(1){ background:var(--schlaege); }
  .rope-bars span:nth-child(2){ background:var(--doubleteam); }
  .rope-bars span:nth-child(3){ background:var(--flug); }
  .rope-bars span:nth-child(4){ background:var(--submission); }

  /* ---------- Tabs ---------- */
  nav.tabs{ display:flex; max-width:60rem; margin:0 auto; padding: 0 1.5rem; }
  .tab-btn{
    flex:1; background:var(--bg-raised); color:var(--paper-dim); border:none;
    border-bottom:4px solid transparent; padding:0.9rem 1rem;
    font-family:'Anton', sans-serif; font-size:1rem; text-transform:uppercase;
    letter-spacing:0.03em; cursor:pointer;
  }
  .tab-btn.active{ color:var(--paper); border-bottom-color:var(--doubleteam); background:var(--bg); }

  main{ max-width:60rem; margin:0 auto; padding:1.8rem 1.5rem 4rem; }

  /* ---------- Steuerelemente ---------- */
  .controls{ display:flex; flex-direction:column; gap:0.9rem; margin-bottom:1.6rem; }
  .controls-row{ display:flex; gap:0.9rem; flex-wrap:wrap; align-items:center; }
  input[type="text"], input[type="search"], select{
    background:var(--bg-raised); color:var(--paper); border:none;
    border-bottom:2px solid var(--line); padding:0.55rem 0.6rem; font-size:0.95rem;
  }
  #move-search{ flex:1; min-width:12rem; }
  .chip-row{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .chip{
    font-weight:600; font-size:0.82rem; padding:0.4rem 0.8rem;
    border:2px solid var(--chip-color, var(--line)); border-radius:3px;
    background:transparent; color:var(--paper); cursor:pointer;
  }
  .chip.active{ background:var(--chip-color, var(--doubleteam)); color:var(--ink); border-color:var(--chip-color, var(--doubleteam)); }
  label.checkbox-label{ display:flex; align-items:center; gap:0.4rem; font-size:0.9rem; color:var(--paper-dim); cursor:pointer; }
  .field-group{ display:flex; flex-direction:column; gap:0.3rem; }
  .field-group span.field-title{ font-size:0.85rem; color:var(--paper-dim); }
  #archive-count{ font-size:0.85rem; color:var(--paper-dim); margin:0 0 0.6rem; }

  /* ---------- Techniken-Raster ---------- */
  #archive-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:1rem; }
  .move-card{ background:var(--card); color:var(--ink); border:1px solid rgba(0,0,0,0.12); overflow:hidden; }
  .move-card-bar{ height:6px; background:var(--card-accent); }
  .move-card-body{ padding:0.9rem 1.05rem 1.1rem; }
  .move-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem; }
  .move-card-head h3{ font-size:1.15rem; text-transform:uppercase; }
  .fav-btn{ background:none; border:none; font-size:1.35rem; line-height:1; color:var(--doubleteam); opacity:0.45; cursor:pointer; padding:0; }
  .fav-btn.active{ opacity:1; }
  .move-card-tags{ display:flex; gap:0.35rem; flex-wrap:wrap; margin:0.55rem 0; }
  .tag{
    font-size:0.68rem; font-weight:700; padding:0.15rem 0.5rem; border-radius:2px;
    border:1px solid transparent; text-transform:uppercase; letter-spacing:0.02em;
  }
  .tag.cat-tag{ background:var(--tag-color); color:#fff; }
  .tag.tier-tag{ border-color:rgba(0,0,0,0.4); color:rgba(0,0,0,0.7); }
  .tag.risk-low{ border-color:#2E7D4F; color:#2E7D4F; }
  .tag.risk-moderate{ border-color:#A9720F; color:#A9720F; }
  .tag.risk-high{ border-color:#B23A2E; color:#B23A2E; }
  .move-card-body p{ font-size:0.92rem; line-height:1.42; margin:0.55rem 0 0; }
  .watch-link{
    display:inline-block; margin-top:0.65rem; font-family:'Anton', sans-serif;
    text-transform:uppercase; letter-spacing:0.02em; font-size:0.76rem;
    background:var(--ink); color:var(--card); padding:0.35rem 0.7rem; text-decoration:none;
  }

  /* ---------- Generator ---------- */
  .gen-panel-block{ background:var(--bg-raised); border:1px solid var(--line); padding:1.1rem 1.2rem; margin-bottom:1.1rem; }
  .gen-panel-block h2{ font-size:1.1rem; text-transform:uppercase; margin-bottom:0.8rem; color:var(--doubleteam); }
  #wrestler-fields{ display:flex; flex-direction:column; gap:0.9rem; }
  .wrestler-field{ display:flex; gap:0.9rem; flex-wrap:wrap; }
  .wrestler-field label{ display:flex; flex-direction:column; gap:0.3rem; font-size:0.85rem; color:var(--paper-dim); flex:1; min-width:11rem; }
  .action-row{ display:flex; gap:0.8rem; flex-wrap:wrap; margin-top:0.4rem; }
  .btn-primary, .btn-secondary{
    font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:0.03em;
    font-size:0.92rem; padding:0.65rem 1.2rem; border:none; cursor:pointer;
  }
  .btn-primary{ background:var(--schlaege); color:#fff; }
  .btn-secondary{ background:transparent; color:var(--paper); border:2px solid var(--line); }

  #card-output{ margin-top:1.4rem; }
  .card-stip{
    background:var(--schlaege); color:#fff; font-family:'Anton', sans-serif;
    text-transform:uppercase; text-align:center; padding:0.7rem 1rem; font-size:1.1rem; letter-spacing:0.02em;
  }
  .card-columns{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:1rem; margin-top:1rem; }
  .wrestler-column{ background:var(--card); color:var(--ink); padding:1rem 1.1rem; }
  .wrestler-column-head{ display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.6rem; }
  .wrestler-column-head h3{ font-size:1.1rem; text-transform:uppercase; margin-right:auto; }
  .archetype-pill{ font-size:0.7rem; font-weight:700; text-transform:uppercase; background:var(--doubleteam); color:var(--ink); padding:0.15rem 0.5rem; border-radius:2px; }
  .reroll-btn{ background:transparent; border:1px solid rgba(0,0,0,0.3); color:var(--ink); font-size:0.75rem; padding:0.25rem 0.55rem; cursor:pointer; }
  .beat-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0.5rem; }
  .beat-list li{ display:flex; align-items:baseline; gap:0.45rem; flex-wrap:wrap; font-size:0.88rem; border-bottom:1px dashed rgba(0,0,0,0.15); padding-bottom:0.4rem; }
  .beat-label{ font-size:0.72rem; text-transform:uppercase; color:rgba(0,0,0,0.55); flex:0 0 6.5rem; }
  .beat-dot{ width:0.6rem; height:0.6rem; border-radius:50%; background:var(--dot-color); display:inline-block; }
  .beat-name{ font-weight:600; }
  .beat-empty{ font-style:italic; color:rgba(0,0,0,0.5); }

  footer{
    max-width:60rem; margin:2rem auto 0; padding:1.5rem 1.5rem 3rem;
    color:var(--paper-dim); font-size:0.82rem; line-height:1.5; border-top:1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<header class="masthead">
  <div class="countdown-badge" id="countdown-badge"></div>
  <h1>Weird Wrestling Organizer</h1>
  <div class="rope-bars"><span></span><span></span><span></span><span></span></div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="archive" role="tab" aria-selected="true">Techniken-Archiv</button>
  <button class="tab-btn" data-tab="generator" role="tab" aria-selected="false">Match-Generator</button>
</nav>

<main>

  <section id="panel-archive">
    <div class="controls">
      <div class="controls-row">
        <input type="search" id="move-search" placeholder="Techniken durchsuchen…" aria-label="Techniken durchsuchen">
        <label class="checkbox-label"><input type="checkbox" id="fav-only-toggle"> Nur Favoriten</label>
      </div>
      <div class="field-group">
        <span class="field-title">Kategorie</span>
        <div class="chip-row" id="archive-cat-chips"></div>
      </div>
      <div class="field-group">
        <span class="field-title">Schwierigkeitsgrad</span>
        <div class="chip-row" id="archive-tier-chips">
          <button type="button" class="chip active" data-tier="basic" aria-pressed="true">Basis</button>
          <button type="button" class="chip active" data-tier="signature" aria-pressed="true">Signature</button>
          <button type="button" class="chip active" data-tier="finisher" aria-pressed="true">Finisher</button>
        </div>
      </div>
      <div class="field-group">
        <span class="field-title">Risiko</span>
        <div class="chip-row" id="archive-risk-chips">
          <button type="button" class="chip active" data-risk="low" aria-pressed="true">Geringes Risiko</button>
          <button type="button" class="chip active" data-risk="moderate" aria-pressed="true">Mittleres Risiko</button>
          <button type="button" class="chip active" data-risk="high" aria-pressed="true">Hohes Risiko</button>
        </div>
      </div>
    </div>
    <p id="archive-count"></p>
    <div id="archive-grid"></div>
  </section>

  <section id="panel-generator" class="hidden">
    <div class="gen-panel-block">
      <h2>Karten-Einstellungen</h2>
      <div class="field-group" style="margin-bottom:0.9rem;">
        <span class="field-title">Kategorien für die Auswahl</span>
        <div class="chip-row" id="gen-cat-chips"></div>
      </div>
      <div class="field-group" style="margin-bottom:0.9rem;">
        <span class="field-title">Risikostufe einbeziehen</span>
        <div class="chip-row" id="gen-risk-chips">
          <button type="button" class="chip active" data-risk="low" aria-pressed="true">Gering</button>
          <button type="button" class="chip active" data-risk="moderate" aria-pressed="true">Mittel</button>
          <button type="button" class="chip" data-risk="high" aria-pressed="false">Hoch</button>
        </div>
      </div>
      <div class="wrestler-field" style="margin-bottom:0.9rem;">
        <label>Teilnehmerzahl
          <select id="wrestler-count">
            <option value="2" selected>2 (Einzelmatch)</option>
            <option value="3">3</option>
            <option value="4">4 (Tag-Team-Paarung)</option>
          </select>
        </label>
        <label>Stipulation
          <select id="stipulation-select"></select>
        </label>
      </div>
      <div id="wrestler-fields"></div>
    </div>

    <div class="action-row">
      <button class="btn-primary" id="generate-btn" type="button">Match-Karte erstellen</button>
      <button class="btn-secondary" id="reroll-all-btn" type="button">Alles neu würfeln</button>
      <button class="btn-secondary" id="copy-btn" type="button">Karte als Text kopieren</button>
    </div>

    <div id="card-output"></div>
  </section>

</main>

<script>
(function(){
  'use strict';

  var CATEGORIES = {
    haltegriffe: { label:'Haltegriffe', color:'#7A4FA0' },
    wuerfe: { label:'Würfe', color:'#2E6E9E' },
    backbreaker: { label:'Backbreaker-Variationen', color:'#1F8A8C' },
    ddt: { label:'DDT-Variationen', color:'#A83246' },
    piledriver: { label:'Piledriver-Variationen', color:'#8C2F39' },
    powerbomb: { label:'Powerbomb-Variationen', color:'#35507A' },
    suplex: { label:'Suplex-Varianten', color:'#4B4A8E' },
    andere: { label:'Andere Angriffe', color:'#C9702F' },
    liegend: { label:'Aktionen bei liegendem Gegner', color:'#6E7A3E' },
    turnbuckle: { label:'Aktionen vom Turnbuckle oder Ringseil', color:'#3E8E62' },
    schlaege: { label:'Schläge', color:'#D8362A' },
    kicks: { label:'Kicks', color:'#E8A63A' },
    doubleteam: { label:'Double-Team Moves', color:'#B23E7A' },
  };

  var ARCHETYPES = {
    flieger:    { label:'Flieger',     weights:{ haltegriffe:4, wuerfe:4, backbreaker:2, ddt:4, piledriver:1, powerbomb:2, suplex:4, andere:8, liegend:8, turnbuckle:30, schlaege:6, kicks:12, doubleteam:5 } },
    kraftpaket: { label:'Kraftpaket',  weights:{ haltegriffe:4, wuerfe:16, backbreaker:10, ddt:4, piledriver:8, powerbomb:14, suplex:12, andere:8, liegend:4, turnbuckle:4, schlaege:8, kicks:3, doubleteam:5 } },
    techniker:  { label:'Techniker',   weights:{ haltegriffe:28, wuerfe:6, backbreaker:4, ddt:12, piledriver:4, powerbomb:4, suplex:14, andere:6, liegend:2, turnbuckle:4, schlaege:4, kicks:4, doubleteam:8 } },
    raufbold:   { label:'Raufbold',    weights:{ haltegriffe:4, wuerfe:8, backbreaker:6, ddt:6, piledriver:3, powerbomb:4, suplex:4, andere:16, liegend:6, turnbuckle:4, schlaege:24, kicks:12, doubleteam:3 } },
    allrounder: { label:'Allrounder',  weights:{ haltegriffe:10, wuerfe:10, backbreaker:10, ddt:10, piledriver:10, powerbomb:10, suplex:10, andere:10, liegend:10, turnbuckle:10, schlaege:10, kicks:10, doubleteam:10 } }
  };

  var STIPULATIONS = [
    'Standard-Einzelmatch',
    'Match ohne Disqualifikation',
    'Sieg überall im Gebäude',
    'Leiter-Match',
    'Tisch-Match',
    'Stahlkäfig-Match',
    'Last-Wrestler-Standing-Match',
    'Backyard-Rumble',
    'Match mit Augenbinde',
    'Lumberjack-Match',
    'Hardcore-Match (alles erlaubt)',
    'Iron-Wrestler-Zeitlimit-Match',
    'Kostüm- &amp; Gimmick-Match',
    'Reise-nach-Jerusalem-Brawl'
  ];

  var BEATS = [
    { key:'opening', label:'Auftakt',     tierPref:['basic'] },
    { key:'control',  label:'Kontrolle',   tierPref:['basic','signature'] },
    { key:'turning',  label:'Wendepunkt',  tierPref:['signature','basic'] },
    { key:'bigspot',  label:'Highlight',   tierPref:['signature','finisher'] },
    { key:'finish',   label:'Finish',      tierPref:['finisher','signature'] }
  ];

  var TIER_LABELS = { basic:'Basis', signature:'Signature', finisher:'Finisher' };
  var RISK_LABELS = { low:'Geringes Risiko', moderate:'Mittleres Risiko', high:'Hohes Risiko' };

  var MOVES = [
    { id:'ankle_lock', name:'Ankle Lock', category:'haltegriffe', tier:'basic', risk:'moderate', desc:'Der Fußknöchel des Gegners wird gegriffen und gegen das Gelenk verdreht. Der Angreifer setzt sich dabei meist selbst zu Boden und zieht mit dem gesamten Körpergewicht am Fuß, um den Druck auf Bänder und Gelenk zu erhöhen.' },
    { id:'armbar', name:'Armbar', category:'haltegriffe', tier:'basic', risk:'low', desc:'Der ausgestreckte Arm des Gegners wird zwischen den eigenen Beinen eingeklemmt und überstreckt. Durch das Zurücklehnen des Oberkörpers entsteht Zug auf Ellenbogen und Schulter, während die Beine den Arm des Gegners fixiert halten.' },
    { id:'bear_hug', name:'Bear Hug', category:'haltegriffe', tier:'basic', risk:'low', desc:'Der Gegner wird von vorne fest umklammert, um mit reiner Körperkraft Druck auf den Rumpf auszuüben. Die Arme werden dabei um den Brustkorb des Gegners geschlossen und immer weiter zusammengedrückt, oft bis der Gegner die Luft anhalten muss.' },
    { id:'body_scissors', name:'Body Scissors', category:'haltegriffe', tier:'basic', risk:'low', desc:'Die Beine werden um den Rumpf des Gegners geschlungen und zusammengepresst. Der Angreifer liegt dabei meist auf dem Rücken und nutzt die Beinmuskulatur, um kontinuierlichen Druck auf die Rippen des Gegners aufzubauen.' },
    { id:'boston_crab', name:'Boston Crab', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Die Beine des liegenden Gegners werden über die eigenen Oberschenkel gelegt, während sich der Angreifer zurücklehnt und die Wirbelsäule dehnt. Der Gegner liegt dabei auf dem Bauch, sodass Rücken und Knie gleichzeitig unter Spannung geraten.' },
    { id:'camel_clutch', name:'Camel Clutch', category:'haltegriffe', tier:'signature', risk:'low', desc:'Der Angreifer sitzt auf dem Rücken des Gegners und zieht dessen Kinn nach hinten. Durch das Gewicht auf dem Rücken und den Zug am Kopf wird sowohl die Wirbelsäule als auch der Nacken des Gegners gedehnt.' },
    { id:'chickenwing', name:'Chickenwing', category:'haltegriffe', tier:'basic', risk:'low', desc:'Ein Arm des Gegners wird von hinten nach oben gedreht und fixiert. Die Hand wird dabei zwischen die Schulterblätter gedrückt, wodurch Druck auf das Schultergelenk entsteht, ohne dass der Angreifer viel eigene Kraft aufwenden muss.' },
    { id:'chokehold', name:'Chokehold', category:'haltegriffe', tier:'basic', risk:'moderate', desc:'Der Hals des Gegners wird gegriffen und zugedrückt, um die Atmung einzuschränken. Die Aktion wird meist von vorne ausgeführt und dient häufig eher der Einschüchterung als einer echten Aufgabe-Technik.' },
    { id:'clawhold', name:'Clawhold', category:'haltegriffe', tier:'basic', risk:'low', desc:'Mit gespreizten Fingern wird auf Kopf oder Gesicht des Gegners Druck ausgeübt. Die Finger krallen sich dabei in die Schläfen oder den Kiefer, um durch punktuellen Druck Schmerz zu erzeugen.' },
    { id:'cobra_clutch', name:'Cobra Clutch', category:'haltegriffe', tier:'basic', risk:'low', desc:'Der Angreifer packt den Gegner von hinten am Hals und presst mit dem freien Arm zusätzlich auf den Kehlkopf. Durch das Verschränken beider Arme im Nacken des Gegners entsteht ein Würgegriff, der zugleich die Schulter des Gegners fixiert.' },
    { id:'cross_arm_breaker', name:'Cross-Arm-Breaker', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Der ausgestreckte Arm des Gegners wird quer über den eigenen Körper gelegt und überstreckt. Der Angreifer presst dabei das Handgelenk des Gegners gegen die eigene Brust, während der Ellenbogen über ein Bein oder die Hüfte gedrückt wird.' },
    { id:'crossface', name:'Crossface', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Von der Seite wird ein Arm des Gegners eingehakt, während mit dem freien Arm Druck auf Gesicht und Nacken ausgeübt wird. Durch das Zurücklehnen entsteht gleichzeitig Zug auf Schulter und Wirbelsäule des liegenden Gegners.' },
    { id:'crossface_chickenwing', name:'Crossface Chickenwing', category:'haltegriffe', tier:'finisher', risk:'moderate', desc:'Eine Kombination aus Chickenwing und Crossface, die gleichzeitig Schulter und Gesicht unter Druck setzt. Ein Arm wird dabei im Nacken fixiert, während der freie Arm des Angreifers zusätzlich das Gesicht des Gegners nach hinten zieht.' },
    { id:'dragon_sleeperhold', name:'Dragon Sleeperhold', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Eine Würgegriff-Variante, bei der zusätzlich ein Bein des Gegners eingehakt wird, um dessen Beweglichkeit einzuschränken. Der Arm liegt dabei fest um den Hals, während das eingehakte Bein ein Entkommen zusätzlich erschwert.' },
    { id:'figure_four_leglock', name:'Figure Four Leglock', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Die Beine des Gegners werden zu einer Vier verschränkt, wodurch Druck auf das Knie entsteht. Der Angreifer rollt sich dabei auf den Rücken und presst mit dem eigenen Körpergewicht die verschränkten Beine weiter zusammen.' },
    { id:'mandible_claw', name:'Mandible Claw', category:'haltegriffe', tier:'signature', risk:'low', desc:'Die Finger werden unter Zunge und Kiefer des Gegners gedrückt, um Schmerz und Würgereiz auszulösen. Die Hand wird dabei von vorne in den Mundraum geführt, während der andere Arm den Kopf des Gegners fixiert.' },
    { id:'nelson_hold', name:'Nelson Hold', category:'haltegriffe', tier:'basic', risk:'low', desc:'Von hinten wird ein oder beide Arme des Gegners unter dessen eigenen Achseln hindurchgeführt und im Nacken fixiert. Je nachdem, ob ein oder beide Arme genutzt werden, spricht man von einem Half oder Full Nelson.' },
    { id:'rear_naked_choke', name:'Rear Naked Choke', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Von hinten wird der Hals des Gegners mit dem Unterarm umschlossen und zugedrückt. Die freie Hand greift dabei den eigenen Bizeps, während der Kopf des Gegners nach vorne gedrückt wird, um den Würgegriff zu verstärken.' },
    { id:'rings_of_saturn', name:'Rings of Saturn', category:'haltegriffe', tier:'finisher', risk:'moderate', desc:'Beide Arme des Gegners werden von hinten verdreht und übereinander fixiert. Durch das gegenläufige Verdrehen beider Schultern entsteht gleichzeitig Druck auf beide Arme, was ein Entkommen besonders schwierig macht.' },
    { id:'sharpshooter', name:'Sharpshooter', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Beide Beine des Gegners werden gekreuzt und festgehalten, während sich der Angreifer zurücklehnt und die Wirbelsäule dehnt. Anders als beim Boston Crab dreht sich der Angreifer dabei mit dem Rücken zum Gegner, was zusätzlichen Zug auf die Knie bringt.' },
    { id:'sleeper_hold', name:'Sleeper Hold', category:'haltegriffe', tier:'basic', risk:'moderate', desc:'Ein Arm wird von hinten um den Hals des Gegners gelegt, um die Blutzufuhr einzuschränken. Die freie Hand stützt dabei oft den Hinterkopf des Gegners, um den Griff noch fester zu schließen.' },
    { id:'spinning_toe_hold', name:'Spinning Toe-Hold', category:'haltegriffe', tier:'basic', risk:'low', desc:'Der Fuß des Gegners wird gegriffen und mit einer Drehbewegung verdreht, um ihn zu Boden zu bringen. Aus der liegenden Position heraus kann der Angreifer den Griff anschließend in eine Beinstreckung überleiten.' },
    { id:'stf', name:'STF', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Der Angreifer sitzt auf dem Rücken des liegenden Gegners, verschränkt dessen Beine und zieht am Kopf nach hinten. Die Kombination aus Gewicht auf dem Rücken und Zug am Kinn setzt Wirbelsäule und Nacken gleichzeitig unter Spannung.' },
    { id:'sts', name:'STS', category:'haltegriffe', tier:'finisher', risk:'moderate', desc:'Eine würgegriffähnliche Halte-Aktion, die Druck auf Hals und Schultern des Gegners kombiniert. Der Arm des Angreifers liegt dabei über der Schulter, während der Griff um den Hals zusätzlich die Atmung einschränkt.' },
    { id:'tazzmission', name:'Tazzmission', category:'haltegriffe', tier:'finisher', risk:'high', desc:'Ein Würgegriff von hinten, bei dem zusätzlich ein Arm des Gegners nach oben gedrückt wird. Durch das Fixieren des Arms kann sich der Gegner kaum noch befreien, während gleichzeitig Druck auf den Hals ausgeübt wird.' },
    { id:'testicular_claw', name:'Testicular Claw', category:'haltegriffe', tier:'basic', risk:'low', desc:'Eine Krallen-Aktion, die im Wrestling meist als komödiantische Einlage statt als ernsthafte Schmerztechnik eingesetzt wird. Die Hand wird dabei kurz in Richtung Unterleib des Gegners geführt, was beim Publikum meist für Gelächter sorgt.' },
    { id:'texas_cloverleaf', name:'Texas Cloverleaf', category:'haltegriffe', tier:'signature', risk:'moderate', desc:'Ein Bein des Gegners wird über das andere gelegt, bevor der Angreifer sich umdreht und beide Beine nach hinten zieht. Anders als beim klassischen Sharpshooter werden die Beine dabei zusätzlich ineinander verschränkt, was den Druck auf die Knie erhöht.' },
    { id:'torture_rack', name:'Torture Rack', category:'haltegriffe', tier:'finisher', risk:'moderate', desc:'Der Gegner wird über die Schultern des Angreifers gelegt, der ihn dort haltend nach hinten dehnt. Durch das eigene Körpergewicht des Gegners entsteht zusätzlicher Zug auf dessen Wirbelsäule, während der Angreifer die Position stabil halten muss.' },
    { id:'olympic_slam', name:'Olympic Slam', category:'wuerfe', tier:'basic', risk:'moderate', desc:'Der Gegner wird über die Schultern gehoben und mit dem Rücken zuerst auf die Matte geworfen. Die Ausgangsposition ähnelt einem Fireman\'s Carry, bevor der Angreifer sich nach vorne beugt und den Gegner nach unten schleudert.' },
    { id:'back_body_drop', name:'Back Body Drop', category:'wuerfe', tier:'basic', risk:'low', desc:'Der Angreifer hebt den Gegner über den eigenen Rücken und wirft ihn hinter sich zu Boden. Oft wird die Aktion genutzt, um einen anlaufenden Gegner mit dessen eigenem Schwung zu Fall zu bringen.' },
    { id:'flapjack', name:'Flapjack', category:'wuerfe', tier:'basic', risk:'moderate', desc:'Der Gegner wird hochgeworfen und landet mit dem Bauch oder der Brust zuerst auf der Matte. Der Angreifer nutzt dabei meist beide Arme, um den Gegner in einer schnellen Aufwärtsbewegung hochzuschleudern, statt ihn kontrolliert abzulegen.' },
    { id:'bodyslam', name:'Bodyslam', category:'wuerfe', tier:'basic', risk:'low', desc:'Der Gegner wird horizontal angehoben und flach auf den Rücken geworfen. Die Aktion gilt als eine der grundlegendsten Wurftechniken und wird oft als Einstieg für weiterführende Angriffe genutzt.' },
    { id:'burning_hammer', name:'Burning Hammer', category:'wuerfe', tier:'finisher', risk:'high', desc:'Der Gegner wird wie bei einem Fireman\'s Carry auf die Schultern gelegt und mit dem Rücken zuerst auf die Matte geschleudert. Durch den ungewöhnlichen Absprungwinkel wirkt die Landung besonders hart, weshalb die Aktion selten und meist als Höhepunkt eines Matches eingesetzt wird.' },
    { id:'chokeslam', name:'Chokeslam', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Der Gegner wird am Hals gepackt, angehoben und senkrecht auf den Rücken fallen gelassen. Die Aktion wirkt besonders eindrucksvoll, wenn deutlich größere Wrestler sie gegen kleinere Gegner ausführen.' },
    { id:'double_handed_chokeslam', name:'Double-Handed Chokeslam', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Eine Chokeslam-Variante, bei der der Gegner mit beiden Händen am Hals gepackt und angehoben wird. Durch den beidhändigen Griff wirkt die Aktion optisch noch dominanter als die einhändige Standardvariante.' },
    { id:'death_valley_driver', name:'Death Valley Driver', category:'wuerfe', tier:'finisher', risk:'high', desc:'Der Gegner wird kopfüber über die Schulter gelegt und rückwärts auf die Matte gestoßen. Die Ausgangsposition ähnelt einem Powerbomb-Ansatz, endet jedoch mit einem harten Aufprall auf dem oberen Rücken statt auf dem gesamten Rücken.' },
    { id:'firemans_carry', name:'Fireman\'s Carry', category:'wuerfe', tier:'basic', risk:'low', desc:'Der Gegner wird über beide Schultern gelegt, die Ausgangsposition vieler Wurftechniken. Aus dieser Haltung heraus kann der Angreifer je nach gewünschter Fortsetzung in verschiedene Slam- oder Suplex-Varianten übergehen.' },
    { id:'frontslam', name:'Frontslam', category:'wuerfe', tier:'basic', risk:'moderate', desc:'Der Gegner wird frontal angehoben und mit dem Oberkörper zuerst auf die Matte geworfen. Anders als beim Bodyslam liegt der Fokus hier auf einem harten, direkten Aufprall statt einer flachen Landung.' },
    { id:'giant_swing', name:'Giant Swing', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Der Gegner wird an den Beinen gepackt und in schneller Drehung durch die Luft geschwungen. Die Zentrifugalkraft der Drehung macht dem Gegner ein Entkommen unmöglich, bis der Angreifer ihn schließlich loslässt.' },
    { id:'gorilla_press_slam', name:'Gorilla Press Slam', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Der Gegner wird über den Kopf gedrückt und anschließend nach vorne zu Boden geworfen. Die Aktion erfordert erhebliche Kraft, da der Gegner während des gesamten Hebevorgangs über dem Kopf des Angreifers balanciert werden muss.' },
    { id:'hip_toss', name:'Hip Toss', category:'wuerfe', tier:'basic', risk:'low', desc:'Der Angreifer nutzt die Hüfte als Hebel, um den Gegner über sich hinweg zu Boden zu werfen. Dabei wird der Arm des Gegners festgehalten, während die eigene Hüfte als Drehpunkt für den Wurf dient.' },
    { id:'irish_whip', name:'Irish Whip', category:'wuerfe', tier:'basic', risk:'low', desc:'Der Gegner wird an Arm oder Handgelenk gepackt und mit Schwung in Richtung Seile oder Ringecke geschleudert. Die Aktion dient meist als Vorbereitung für einen weiteren Angriff, sobald der Gegner zurückfedert oder aufprallt.' },
    { id:'last_call_fallaway_slam', name:'Last Call / Fallaway Slam', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Der Gegner wird seitlich am Körper hochgehoben und im Bogen von sich weggeworfen. Anders als bei anderen Slams lässt der Angreifer den Gegner dabei vollständig los, statt ihn kontrolliert abzulegen.' },
    { id:'powerslam', name:'Powerslam', category:'wuerfe', tier:'basic', risk:'moderate', desc:'Der Gegner wird angehoben, während der Angreifer beim Aufprall auf ihm landet. Durch das zusätzliche Körpergewicht des Angreifers beim Aufprall wirkt die Aktion deutlich schwerer als ein einfacher Bodyslam.' },
    { id:'front_powerslam', name:'Front Powerslam', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Eine Powerslam-Variante, bei der der Gegner von vorne gepackt und über die Schulter geworfen wird. Der Angreifer dreht den Gegner dabei über die eigene Schulter, bevor beide gemeinsam auf der Matte landen.' },
    { id:'running_powerslam', name:'Running Powerslam', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Der Angreifer nimmt vor dem Powerslam Anlauf, um zusätzliche Wucht in den Aufprall zu bringen. Der zusätzliche Schwung macht die Landung für den Gegner deutlich härter als bei der stationären Variante.' },
    { id:'reverse_mat_slam', name:'Reverse Mat Slam', category:'wuerfe', tier:'basic', risk:'low', desc:'Der Gegner wird rückwärts zu Boden gedrückt, statt geworfen zu werden. Der Angreifer kontrolliert dabei den Kopf oder Oberkörper des Gegners und führt ihn gezielt nach unten, statt ihn durch die Luft zu schleudern.' },
    { id:'side_slam', name:'Side Slam', category:'wuerfe', tier:'basic', risk:'moderate', desc:'Der Gegner wird seitlich am Körper angehoben und durch eine Drehung des Oberkörpers zu Boden gebracht. Der Angreifer nutzt dabei die eigene Drehbewegung, um den Gegner mit Schwung auf den Rücken zu legen.' },
    { id:'sidewalk_slam', name:'Sidewalk Slam', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Der Gegner wird quer über den Körper des Angreifers gelegt und seitlich zu Boden fallen gelassen. Die Aktion wirkt dabei kontrollierter als andere Slam-Varianten, da der Angreifer den Gegner während der gesamten Bewegung eng am eigenen Körper hält.' },
    { id:'spinning_side_slam', name:'Spinning Side Slam', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Eine Side-Slam-Variante mit zusätzlicher Drehung vor dem Aufprall. Durch die Rotation gewinnt der Angreifer zusätzlichen Schwung, der die Landung des Gegners deutlich härter macht.' },
    { id:'spinebuster', name:'Spinebuster', category:'wuerfe', tier:'signature', risk:'moderate', desc:'Der Angreifer umgreift die Hüfte des Gegners und wirft ihn rücklings zu Boden, wobei beide zusammenprallen. Der Angreifer landet dabei meist direkt auf dem Oberkörper des Gegners, was die Wucht der Aktion zusätzlich verstärkt.' },
    { id:'backbreaker_klassisch', name:'Backbreaker (klassisch)', category:'backbreaker', tier:'basic', risk:'low', desc:'Der Gegner wird waagerecht über dem angewinkelten Knie des Angreifers gehalten und mit dem Rücken darauf fallen gelassen. Ein Arm stützt dabei die Schulter, während der andere zwischen den Beinen des Gegners hindurchgreift, um ihn anzuheben.' },
    { id:'tilt_a_whirl_backbreaker', name:'Tilt-A-Whirl Backbreaker', category:'backbreaker', tier:'signature', risk:'moderate', desc:'Der Angreifer fängt den aus den Seilen zurückfedernden Gegner auf, dreht ihn einmal um die eigene Achse und lässt ihn mit dem Rücken auf das ausgestreckte Knie fallen. Die Drehbewegung macht die Aktion für Zuschauer besonders dynamisch, da der Gegner kurzzeitig frei in der Luft schwebt.' },
    { id:'argentine_backbreaker', name:'Argentine Backbreaker', category:'backbreaker', tier:'signature', risk:'moderate', desc:'Der Gegner wird rücklings über beide Schultern gelegt, während der Angreifer an Kinn und Bein zieht, um die Wirbelsäule zu belasten. Anders als beim klassischen Backbreaker wird der Gegner dabei über die volle Schulterbreite getragen, statt nur über ein Knie gelegt zu werden.' },
    { id:'backstabber_double_knee_backbreaker', name:'Backstabber / Double Knee Backbreaker', category:'backbreaker', tier:'signature', risk:'moderate', desc:'Der Angreifer steht hinter dem hochgehobenen Gegner und lässt sich mit beiden Knien in dessen Rücken fallen. Der Gegner wird dabei meist von einem zweiten Wrestler oder durch einen vorbereitenden Griff in Position gehalten.' },
    { id:'gorilla_press_backbreaker', name:'Gorilla Press Backbreaker', category:'backbreaker', tier:'signature', risk:'moderate', desc:'Der Gegner wird wie bei einem Gorilla Press über den Kopf gehoben, bevor er mit dem Rücken auf das Knie des Angreifers fällt. Die Kombination aus Überkopf-Hebung und anschließendem Fall auf das Knie verlangt dem Angreifer besonders viel Kraft ab.' },
    { id:'side_backbreaker', name:'Side Backbreaker', category:'backbreaker', tier:'basic', risk:'low', desc:'Eine seitliche Variante des klassischen Backbreakers, bei der der Gegner von der Seite über das Knie gelegt wird. Der Angreifer greift dabei meist unter Arm und Bein des Gegners, um ihn seitlich anzuheben.' },
    { id:'ddt', name:'DDT', category:'ddt', tier:'signature', risk:'moderate', desc:'Der Kopf des vorgebeugten Gegners wird unter dem Arm eingeklemmt, bevor sich der Angreifer nach hinten fallen lässt und den Kopf des Gegners auf die Matte drückt. Die Aktion beginnt meist aus einem Kopfgriff heraus, wodurch der Gegner bereits vorgebeugt und für den Fall vorbereitet ist.' },
    { id:'brainbuster', name:'Brainbuster', category:'ddt', tier:'finisher', risk:'high', desc:'Der vorgebeugte Kopf des Gegners wird wie beim DDT unter dem Arm eingeklemmt, doch statt nach hinten zu fallen, kippt der Angreifer den Gegner wie bei einem Suplex nach oben und lässt ihn kopfüber aufkommen. Die Kombination aus Suplex-artigem Hochheben und DDT-Kopfgriff macht die Aktion zu einer der intensiveren Varianten der Kategorie.' },
    { id:'reverse_ddt', name:'Reverse DDT', category:'ddt', tier:'signature', risk:'moderate', desc:'Eine DDT-Variante, bei der der Angreifer den Gegner von vorne statt von hinten zu Boden führt. Der Kopfgriff bleibt dabei erhalten, jedoch fällt der Angreifer in die entgegengesetzte Richtung als beim klassischen DDT.' },
    { id:'impaler_ddt', name:'Impaler DDT', category:'ddt', tier:'finisher', risk:'high', desc:'Eine DDT-Variante, bei der der Gegner vor dem Aufprall zusätzlich angehoben und gedreht wird. Durch die Drehung in der Luft verändert sich der Aufprallwinkel des Kopfes, was die Aktion optisch von einem gewöhnlichen DDT abhebt.' },
    { id:'tornado_ddt', name:'Tornado DDT', category:'ddt', tier:'signature', risk:'high', desc:'Der Angreifer schwingt sich um den Gegner herum, bevor der eigentliche DDT folgt. Die Schwungbewegung wird meist aus den Seilen oder von der zweiten Ringecke heraus eingeleitet, um zusätzlichen Drehimpuls in die Aktion zu bringen.' },
    { id:'jumping_swinging_ddt', name:'Jumping Swinging DDT', category:'ddt', tier:'signature', risk:'moderate', desc:'Eine DDT-Variante mit einem Sprung und einer Drehbewegung vor dem Aufprall. Der Angreifer springt dabei seitlich am festgehaltenen Kopf des Gegners vorbei, bevor die eigentliche Fallbewegung des DDT folgt.' },
    { id:'rope_hung_ddt_spike_ddt', name:'Rope Hung DDT/Spike DDT', category:'ddt', tier:'finisher', risk:'high', desc:'Der Kopf des Gegners wird in den Seilen fixiert, bevor der Angreifer den DDT mit zusätzlicher Wucht ausführt. Durch die Fixierung am Seil trifft der Kopf des Gegners die Matte in einem steileren Winkel als bei der Standardvariante.' },
    { id:'piledriver', name:'Piledriver', category:'piledriver', tier:'finisher', risk:'high', desc:'Der Gegner wird kopfüber gehalten, während sich der Angreifer schnell hinsetzt und den Kopf des Gegners kontrolliert auf den Ringboden treffen lässt. Beide Beine des Gegners werden dabei zwischen den Armen des Angreifers eingeklemmt, um die Position während des gesamten Ablaufs stabil zu halten.' },
    { id:'flip_piledriver', name:'Flip Piledriver', category:'piledriver', tier:'finisher', risk:'high', desc:'Vor dem eigentlichen Piledriver führt der Angreifer eine zusätzliche Drehung mit dem Gegner aus. Die Drehbewegung verändert die Ausgangsposition, bevor der Gegner wie bei der klassischen Variante kopfüber zu Boden gebracht wird.' },
    { id:'reverse_oder_tombstone_piledriver', name:'Reverse oder Tombstone Piledriver', category:'piledriver', tier:'finisher', risk:'high', desc:'Eine Piledriver-Variante, bei der sich der Angreifer hinkniet und den kopfüber gehaltenen Gegner kontrolliert auf die eigenen Knie aufkommen lässt. Durch das Abfangen auf den Knien statt auf dem Ringboden wird der Aufprall für den Kopf des Gegners etwas gedämpft.' },
    { id:'powerbomb', name:'Powerbomb', category:'powerbomb', tier:'finisher', risk:'high', desc:'Der Gegner wird auf die Schultern des Angreifers gehoben und anschließend mit dem Rücken zuerst auf die Matte geschleudert. Die Ausgangsposition erfordert, dass der Gegner nach vorne gebeugt zwischen die Beine des Angreifers greift, bevor er hochgehoben wird.' },
    { id:'crucifix_powerbomb', name:'Crucifix Powerbomb', category:'powerbomb', tier:'finisher', risk:'high', desc:'Der Gegner wird in einer Kreuz-Position auf den Schultern gehalten, bevor der Angreifer ihn nach vorne zu Boden wirft. Die Arme des Gegners hängen dabei seitlich herab, was der Aktion ihren namensgebenden Anblick verleiht.' },
    { id:'double_underhook_powerbomb', name:'Double Underhook Powerbomb', category:'powerbomb', tier:'finisher', risk:'high', desc:'Beide Arme des Gegners werden von unten eingehakt, bevor er wie bei einer Powerbomb zu Boden gebracht wird. Durch das Einhaken beider Arme hat der Gegner kaum eine Möglichkeit, sich während des Wurfs zu befreien.' },
    { id:'ganso_bomb', name:'Ganso Bomb', category:'powerbomb', tier:'finisher', risk:'high', desc:'Eine besonders kontrollierte Powerbomb-Variante, bei der der Angreifer den Gegner langsam und mit Betonung ablegt. Statt eines schnellen Wurfs wird der Gegner dabei bewusst verzögert zu Boden gebracht, um die Wucht des Aufpralls zu betonen.' },
    { id:'inverted_powerbomb', name:'Inverted Powerbomb', category:'powerbomb', tier:'finisher', risk:'high', desc:'Der Gegner wird mit dem Gesicht zum Angreifer auf die Schultern gehoben, bevor die Powerbomb folgt. Die veränderte Ausgangsposition sorgt für einen anderen Landewinkel als bei der klassischen Powerbomb.' },
    { id:'last_ride_elevated_powerbomb', name:'Last Ride / Elevated Powerbomb', category:'powerbomb', tier:'finisher', risk:'high', desc:'Der Gegner wird besonders hoch über den Kopf gehoben, bevor er zu Boden geworfen wird. Die zusätzliche Höhe verlängert die Fallzeit und verstärkt dadurch den Eindruck von Wucht beim Aufprall.' },
    { id:'sit_down_powerbomb', name:'Sit-Down Powerbomb', category:'powerbomb', tier:'signature', risk:'moderate', desc:'Nach dem Hochheben des Gegners setzt sich der Angreifer beim Aufprall selbst mit hin, um zusätzliches Gewicht in die Aktion zu legen. Der Angreifer landet dabei direkt über dem Gegner, statt ihn allein zu Boden zu werfen.' },
    { id:'gutwrench_powerbomb', name:'Gutwrench Powerbomb', category:'powerbomb', tier:'signature', risk:'moderate', desc:'Der Gegner wird von vorne um die Körpermitte gepackt, hochgehoben und wie bei einer Powerbomb zu Boden gebracht. Der Greifpunkt um die Körpermitte unterscheidet diese Variante vom klassischen Ansatz über die Schultern.' },
    { id:'suplex', name:'Suplex', category:'suplex', tier:'basic', risk:'low', desc:'Der Gegner wird von vorne umfasst, hochgehoben und rückwärts auf den Rücken gebracht. Der Angreifer steht dem Gegner dabei zugewandt gegenüber, bevor beide gemeinsam nach hinten kippen.' },
    { id:'back_suplex', name:'Back Suplex', category:'suplex', tier:'basic', risk:'moderate', desc:'Der Angreifer packt den Gegner von hinten um die Körpermitte und wirft ihn über den eigenen Kopf. Durch den Griff von hinten entsteht ein anderer Bewegungsablauf als beim klassischen, frontalen Suplex.' },
    { id:'belly_to_belly_suplex', name:'Belly to Belly Suplex', category:'suplex', tier:'basic', risk:'moderate', desc:'Von vorne wird der Gegner um die Körpermitte gepackt und über den Kopf des Angreifers geworfen. Bauch an Bauch haltend nutzt der Angreifer die eigene Hüfte, um den Gegner in einem Bogen über sich hinweg zu schleudern.' },
    { id:'delayed_vertical_suplex', name:'Delayed Vertical Suplex', category:'suplex', tier:'signature', risk:'moderate', desc:'Der Gegner wird kopfüber in der Luft gehalten, bevor sich der Angreifer nach hinten fallen lässt und beide auf dem Rücken landen. Die bewusste Verzögerung in der Luft demonstriert dabei die Kraft des Angreifers, bevor der eigentliche Wurf folgt.' },
    { id:'exploder_suplex', name:'Exploder Suplex', category:'suplex', tier:'signature', risk:'moderate', desc:'Der Angreifer wirft den Gegner mit einer seitlichen Drehbewegung und lässt ihn im hohen Bogen los. Anders als bei einem klassischen Suplex hält der Angreifer den Gegner dabei nicht bis zur Landung fest, sondern lässt ihn während der Wurfbewegung los.' },
    { id:'fishermans_suplex', name:'Fisherman\'s Suplex', category:'suplex', tier:'signature', risk:'moderate', desc:'Ein Bein des Gegners wird zusätzlich eingehakt, bevor der Suplex ausgeführt und oft in einen Pinversuch übergeleitet wird. Das eingehakte Bein erlaubt es dem Angreifer, den Gegner direkt nach der Landung in einer Schulterpin-Position zu halten.' },
    { id:'gutwrench_suplex', name:'Gutwrench Suplex', category:'suplex', tier:'basic', risk:'moderate', desc:'Der Gegner wird von vorne um die Körpermitte gepackt und seitlich über den Angreifer geworfen. Der feste Griff um die Körpermitte des Gegners unterscheidet diese Variante vom klassischen, über den Nacken geführten Suplex.' },
    { id:'german_suplex', name:'German Suplex', category:'suplex', tier:'signature', risk:'moderate', desc:'Von hinten wird der Gegner um die Körpermitte gepackt, nach hinten übergestreckt und mit einer Brücke abgelegt. Die abschließende Brücke des Angreifers sorgt dafür, dass beide Wrestler nur kurz und kontrolliert auf der Matte aufkommen.' },
    { id:'release_german_suplex', name:'Release German Suplex', category:'suplex', tier:'finisher', risk:'high', desc:'Ein German Suplex, bei dem der Angreifer den Gegner am höchsten Punkt des Wurfs loslässt. Ohne die stützende Brücke der Standardvariante fliegt der Gegner dabei freier durch die Luft, bevor er selbstständig aufkommt.' },
    { id:'nelson_suplex', name:'Nelson Suplex', category:'suplex', tier:'signature', risk:'moderate', desc:'Aus einem Nelson-Griff heraus wird der Gegner nach hinten in einen Suplex gehoben. Die Arme des Gegners bleiben dabei durch den vorausgehenden Nelson-Griff fixiert, was ihm ein Entkommen während des Wurfs erschwert.' },
    { id:'northern_lights_suplex', name:'Northern Lights Suplex', category:'suplex', tier:'signature', risk:'moderate', desc:'Ein Suplex, der direkt in eine Brücken-Pinposition übergeht. Nach dem Wurf hält der Angreifer die Brücke, um sofort im Anschluss einen Pinversuch zu starten, statt den Griff zu lösen.' },
    { id:'suplex_powerslam', name:'Suplex Powerslam', category:'suplex', tier:'signature', risk:'moderate', desc:'Der Gegner wird wie bei einem Suplex hochgehoben, landet aber wie bei einer Powerslam mit dem Angreifer obenauf. Die Kombination beider Techniken sorgt dafür, dass der Angreifer beim Aufprall zusätzliches Gewicht auf den Gegner bringt.' },
    { id:'underhook_suplex', name:'Underhook Suplex', category:'suplex', tier:'basic', risk:'moderate', desc:'Ein Arm des Gegners wird von unten eingehakt, bevor der Suplex ausgeführt wird. Der eingehakte Arm dient dabei als zusätzlicher Hebel, um den Gegner leichter in die Höhe zu bringen.' },
    { id:'double_underhook_suplex', name:'Double Underhook Suplex', category:'suplex', tier:'signature', risk:'moderate', desc:'Beide Arme des Gegners werden von unten eingehakt, bevor der Suplex ausgeführt wird. Durch das Einhaken beider Arme wird der Oberkörper des Gegners während des gesamten Wurfs besonders stabil fixiert.' },
    { id:'atomic_drop', name:'Atomic Drop', category:'andere', tier:'basic', risk:'low', desc:'Der von hinten gepackte Gegner wird angehoben und mit dem Gesäß auf das Knie des Angreifers fallen gelassen. Der Angreifer greift dabei um die Hüfte des Gegners, um ihn kontrolliert über das eigene angewinkelte Knie zu führen.' },
    { id:'body_scissors_atomic_drop', name:'Body Scissors Atomic Drop', category:'andere', tier:'signature', risk:'moderate', desc:'Eine Atomic-Drop-Variante, bei der die Beine des Angreifers zusätzlich um die Körpermitte des Gegners geschlungen werden. Durch die zusätzliche Beinklammer wird der Gegner während des gesamten Ablaufs noch enger am Angreifer fixiert.' },
    { id:'inverted_atomic_drop', name:'Inverted Atomic Drop', category:'andere', tier:'basic', risk:'low', desc:'Eine Atomic-Drop-Variante, bei der der Gegner mit dem Gesicht zum Angreifer fallen gelassen wird. Der veränderte Blickwinkel des Gegners unterscheidet diese Variante von der klassischen Ausführung von hinten.' },
    { id:'bulldog', name:'Bulldog', category:'andere', tier:'signature', risk:'moderate', desc:'Der Angreifer springt bei festgehaltenem Kopf des Gegners nach vorne und drückt dessen Gesicht in die Matte. Der Kopf des Gegners wird dabei meist schon vor dem Sprung in einem Kopfgriff fixiert, um die Bewegung kontrolliert einzuleiten.' },
    { id:'cutter', name:'Cutter', category:'andere', tier:'signature', risk:'moderate', desc:'Der Kopf des Gegners wird unter den Arm genommen, bevor sich der Angreifer nach vorne fallen lässt und den Gegner mit nach unten reißt. Die Aktion kann sowohl aus dem Stand als auch nach einem Sprung heraus angesetzt werden.' },
    { id:'stunner', name:'Stunner', category:'andere', tier:'finisher', risk:'moderate', desc:'Eine Cutter-Variante, bei der sich der Angreifer nach hinten setzt und den Kopf des Gegners dabei nach unten zieht. Statt nach vorne zu fallen, sackt der Angreifer bei dieser Variante regelrecht in die Knie.' },
    { id:'facebuster', name:'Facebuster', category:'andere', tier:'basic', risk:'moderate', desc:'Der Kopf des Gegners wird gegriffen und mit Schwung nach unten in die Matte gedrückt. Die Aktion wird meist aus einem Kopfgriff heraus eingeleitet, wobei der Angreifer den Kopf des Gegners aktiv nach unten führt.' },
    { id:'double_underhook_facebuster', name:'Double Underhook Facebuster', category:'andere', tier:'signature', risk:'moderate', desc:'Beide Arme des Gegners werden von unten eingehakt, bevor sein Gesicht in die Matte gedrückt wird. Die eingehakten Arme verhindern dabei, dass sich der Gegner beim Sturz nach vorne abstützen kann.' },
    { id:'sitout_facebuster', name:'Sitout Facebuster', category:'andere', tier:'signature', risk:'moderate', desc:'Der Angreifer setzt sich beim Facebuster zusätzlich hin, um mehr Wucht in die Aktion zu legen. Durch das eigene Hinsetzen entsteht zusätzlicher Zug auf den Kopf des Gegners, der die Aktion intensiver wirken lässt.' },
    { id:'headbutt', name:'Headbutt', category:'andere', tier:'basic', risk:'low', desc:'Der Angreifer stößt mit der eigenen Stirn gegen Kopf oder Oberkörper des Gegners. Die Aktion kann sowohl aus dem Stand als auch mit kurzem Anlauf ausgeführt werden.' },
    { id:'jawbreaker', name:'Jawbreaker', category:'andere', tier:'basic', risk:'low', desc:'Der Kopf des Gegners wird von hinten gegriffen und nach vorne gegen das angehobene Knie des Angreifers gezogen. Die Aktion wird häufig als Konter genutzt, wenn der Gegner den Angreifer von hinten gepackt hat.' },
    { id:'neckbreaker', name:'Neckbreaker', category:'andere', tier:'signature', risk:'moderate', desc:'Der Kopf des Gegners wird unter den Arm genommen, bevor der Angreifer sich setzt und den Nacken des Gegners über das eigene Bein zieht. Beim Hinsetzen wird der Oberkörper des Gegners nach hinten über das ausgestreckte Bein des Angreifers gezogen.' },
    { id:'overdrive', name:'Overdrive', category:'andere', tier:'finisher', risk:'moderate', desc:'Eine Neckbreaker-Variante mit zusätzlicher Drehbewegung vor dem Aufprall. Die Drehung verändert den Winkel, in dem der Nacken des Gegners schließlich auf das Bein des Angreifers trifft.' },
    { id:'swinging_neckbreaker', name:'Swinging Neckbreaker', category:'andere', tier:'signature', risk:'moderate', desc:'Der Angreifer schwingt den Gegner vor dem Neckbreaker einmal zur Seite, um mehr Schwung aufzubauen. Die seitliche Schwungbewegung sorgt für zusätzliche Dynamik, bevor der eigentliche Neckbreaker folgt.' },
    { id:'russian_legsweep_grapevine_takedown', name:'Russian Legsweep / Grapevine Takedown', category:'andere', tier:'basic', risk:'low', desc:'Der Angreifer hakt ein Bein des Gegners ein und zieht ihn rückwärts zu Boden. Durch das Einhaken des Beins verliert der Gegner dabei abrupt das Gleichgewicht nach hinten.' },
    { id:'samoan_drop', name:'Samoan Drop', category:'andere', tier:'signature', risk:'moderate', desc:'Der Gegner wird über die Schulter des Angreifers gelegt, bevor dieser sich zurückfallen lässt, sodass der Gegner flach landet. Die Ausgangsposition ähnelt einem Fireman\'s Carry, endet jedoch mit einem direkten Fall nach hinten statt einem Wurf nach vorne.' },
    { id:'shoulderbreaker', name:'Shoulderbreaker', category:'andere', tier:'basic', risk:'moderate', desc:'Der Gegner wird über die Schulter gelegt und mit der eigenen Schulter voran nach hinten fallen gelassen. Der Angreifer nutzt dabei die eigene Schulter als Auftreffpunkt für den Rücken des Gegners.' },
    { id:'stomachbreaker', name:'Stomachbreaker', category:'andere', tier:'basic', risk:'moderate', desc:'Der Gegner wird über das angehobene Knie des Angreifers mit dem Bauch nach unten gelegt. Der Angreifer greift dabei meist um die Hüfte des Gegners, um ihn kontrolliert über das eigene Knie zu ziehen.' },
    { id:'suicide_dive_tope', name:'Suicide Dive / Tope', category:'andere', tier:'signature', risk:'high', desc:'Der Angreifer springt durch die Seile hindurch auf den außerhalb des Rings stehenden Gegner. Da die Aktion außerhalb des schützenden Rings stattfindet, zählt sie zu den risikoreicheren Techniken im Wrestling.' },
    { id:'gorilla_press_stomachbreaker', name:'Gorilla Press Stomachbreaker', category:'andere', tier:'signature', risk:'moderate', desc:'Der Gegner wird über den Kopf gedrückt, bevor er mit dem Bauch auf das Knie des Angreifers fällt. Die Kombination aus Überkopf-Hebung und anschließendem Stomachbreaker verlangt dem Angreifer besonders viel Kraft ab.' },
    { id:'twist_of_fate', name:'Twist Of Fate', category:'andere', tier:'finisher', risk:'moderate', desc:'Der Angreifer dreht den Gegner einmal um die eigene Achse, bevor er ihn in einen Cutter führt. Die vorausgehende Drehung soll den Gegner zusätzlich desorientieren, bevor der eigentliche Cutter folgt.' },
    { id:'snake_eyes', name:'Snake Eyes', category:'andere', tier:'basic', risk:'moderate', desc:'Der Kopf des Gegners wird gegen den obersten Seilstrang oder die Ringecke gestoßen. Der Angreifer hält den Gegner dabei meist an Kopf oder Nacken fest, um ihn gezielt gegen das Hindernis zu führen.' },
    { id:'big_splash', name:'Big Splash', category:'liegend', tier:'signature', risk:'moderate', desc:'Der Angreifer nimmt in den Seilen Anlauf und springt mit dem Bauch voran auf den am Boden liegenden Gegner. Durch den Anlauf über die Seile trifft der Angreifer mit deutlich mehr Schwung auf als bei einem Sprung ohne Anlauf.' },
    { id:'diving_headbutt_liegender_gegner', name:'Diving Headbutt (liegender Gegner)', category:'liegend', tier:'signature', risk:'high', desc:'Der Angreifer lässt sich von den Seilen kopfüber auf den am Boden liegenden Gegner fallen. Die Aktion erfordert präzises Timing, da der Angreifer beim Aufprall selbst kaum abfedern kann.' },
    { id:'elbow_drop', name:'Elbow drop', category:'liegend', tier:'basic', risk:'low', desc:'Der Angreifer springt und lässt den Ellenbogen auf den liegenden Gegner niedersausen. Der Ellenbogen wird dabei meist gezielt auf Brust oder Kopf des liegenden Gegners ausgerichtet.' },
    { id:'fistdrop', name:'Fistdrop', category:'liegend', tier:'basic', risk:'low', desc:'Der Angreifer springt und lässt die Faust auf den liegenden Gegner niedersausen. Die Aktion ähnelt dem Elbow Drop, setzt jedoch die geschlossene Faust statt des Ellenbogens als Auftreffpunkt ein.' },
    { id:'knee_drop', name:'Knee Drop', category:'liegend', tier:'basic', risk:'low', desc:'Der Angreifer springt und lässt das angewinkelte Knie auf einen liegenden Körperteil des Gegners niedersausen. Häufig wird die Aktion gezielt auf Kopf, Brust oder Bauch des Gegners ausgerichtet.' },
    { id:'legdrop', name:'Legdrop', category:'liegend', tier:'basic', risk:'low', desc:'Der Angreifer springt und lässt das gestreckte Bein quer über den liegenden Gegner fallen. Das gestreckte Bein trifft dabei meist Hals oder Brust des liegenden Gegners.' },
    { id:'hip_drop_sitdown_splash', name:'Hip Drop / Sitdown Splash', category:'liegend', tier:'basic', risk:'low', desc:'Der Angreifer springt und landet mit dem Gesäß auf dem liegenden Gegner. Die Aktion wird oft gezielt auf den Bauch- oder Brustbereich des liegenden Gegners ausgerichtet.' },
    { id:'crossed_hand_of_god', name:'Crossed Hand of God', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Von der obersten Ringecke springt der Angreifer mit vor der Brust gekreuzten Armen ab und trifft den liegenden Gegner am Hals. Die gekreuzten Arme bündeln den Aufprall auf einen schmalen Bereich am Hals des Gegners.' },
    { id:'crossbody', name:'Crossbody', category:'turnbuckle', tier:'basic', risk:'low', desc:'Der Angreifer springt von erhöhter Position ab und landet quer auf dem Oberkörper des stehenden Gegners. Durch den queren Aufprall wird der stehende Gegner meist rückwärts zu Boden gerissen, wonach direkt ein Pinversuch folgen kann.' },
    { id:'double_stomp', name:'Double Stomp', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Der Angreifer springt ab und landet mit beiden Füßen gleichzeitig auf dem liegenden Gegner. Beide Füße treffen dabei gebündelt auf denselben Körperbereich, was den Aufprall im Vergleich zu einem einzelnen Tritt verstärkt.' },
    { id:'plancha', name:'Plancha', category:'turnbuckle', tier:'signature', risk:'high', desc:'Der Angreifer springt von den Seilen mit dem Körper voran auf einen außerhalb des Rings stehenden Gegner. Da die Landung außerhalb des Rings meist auf hartem Boden erfolgt, zählt die Aktion zu den risikoreicheren Sprungtechniken.' },
    { id:'diving_double_stomp', name:'Diving Double Stomp', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Ein Double Stomp, der von der obersten Ringecke statt von den Seilen ausgeführt wird. Die größere Höhe der Ringecke sorgt für einen härteren Aufprall als bei der Ausführung von den mittleren Seilen.' },
    { id:'diving_elbow_drop', name:'Diving Elbow Drop', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Von den Seilen kommend lässt der Angreifer den Ellenbogen auf den Kopf oder Oberkörper des liegenden Gegners niedersausen. Der Sprungansatz von den Seilen sorgt dabei für zusätzlichen Schwung im Vergleich zur Ausführung aus dem Stand.' },
    { id:'diving_fist_drop', name:'Diving Fist Drop', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Der Angreifer springt von der obersten Ringecke und lässt die Faust auf den liegenden Gegner niedersausen. Die größere Absprunghöhe der Ringecke verstärkt den Aufprall gegenüber einem Fistdrop aus dem Stand.' },
    { id:'diving_headbutt', name:'Diving Headbutt', category:'turnbuckle', tier:'signature', risk:'high', desc:'Der Angreifer lässt sich von der obersten Ringecke kopfüber auf den liegenden Gegner fallen. Wegen der Absprunghöhe und der fehlenden Abfederungsmöglichkeit zählt diese Variante zu den risikoreicheren Techniken der Kategorie.' },
    { id:'diving_knee_drop', name:'Diving Knee Drop', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Der Angreifer springt von der obersten Ringecke und lässt das Knie auf den liegenden Gegner niedersausen. Die zusätzliche Höhe der Ringecke macht den Aufprall spürbar härter als bei der Ausführung aus dem Stand.' },
    { id:'diving_leg_drop', name:'Diving Leg Drop', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Von den Seilen kommend trifft der Angreifer den Kopf oder Oberkörper des liegenden Gegners mit der Unterseite des gestreckten Beins. Der Sprungansatz sorgt für mehr Schwung, als es ein Legdrop aus dem Stand könnte.' },
    { id:'hurracanrana', name:'Hurracanrana', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Der Angreifer springt auf die Schultern des Gegners und wirft ihn mit einer Scherenbewegung der Beine nach hinten. Die Beine des Angreifers umschließen dabei den Kopf des Gegners, bevor eine Drehung beide zu Boden bringt.' },
    { id:'brainshoot', name:'Brainshoot', category:'turnbuckle', tier:'finisher', risk:'high', desc:'Eine Hurracanrana-Variante, die statt mit einem Wurf mit einem harten Aufprall des Kopfes endet. Anstatt den Gegner sanft abzulegen, führt der Angreifer die Drehbewegung so, dass der Kopf des Gegners direkt auf die Matte trifft.' },
    { id:'moonsault', name:'Moonsault', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Ein rückwärtiger Salto von der obersten Ringecke, bei dem der Angreifer auf dem liegenden Gegner landet. Der Angreifer steht dabei mit dem Rücken zum Ring, bevor er sich rückwärts abstößt und in der Luft eine volle Drehung vollzieht.' },
    { id:'corkscrew_moonsault', name:'Corkscrew Moonsault', category:'turnbuckle', tier:'finisher', risk:'high', desc:'Ein Moonsault mit zusätzlicher Drehung um die eigene Körperachse. Die zusätzliche Längsdrehung macht die Aktion technisch anspruchsvoller als den klassischen Moonsault.' },
    { id:'springboard_moonsault', name:'Springboard Moonsault', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Der Angreifer nutzt das mittlere Seil als Sprungbrett, um zusätzlichen Schwung für den Moonsault zu holen. Der Absprung über das mittlere Seil ersetzt dabei den Absprung von der obersten Ringecke.' },
    { id:'split_legged_moonsault_super_star_press', name:'Split-Legged Moonsault (Super Star Press)', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Ein Moonsault, bei dem die Beine beim Sprung gespreizt werden. Die gespreizte Beinhaltung verändert das optische Erscheinungsbild der Aktion gegenüber der klassischen, geschlossenen Ausführung.' },
    { id:'triple_jump_moonsault', name:'Triple Jump Moonsault', category:'turnbuckle', tier:'finisher', risk:'high', desc:'Ein Moonsault, dem mehrere Zwischensprünge vorausgehen, um zusätzliche Höhe und Schwung für die Aktion zu gewinnen. Der Angreifer springt dabei typischerweise vom Boden auf einen Gegenstand oder das mittlere Seil, bevor er schließlich von der obersten Ringecke abspringt.' },
    { id:'rope_walk', name:'Rope Walk', category:'turnbuckle', tier:'signature', risk:'low', desc:'Der Angreifer balanciert auf dem obersten Seilstrang, um von dort aus einen weiteren Angriff vorzubereiten. Das Balancieren auf dem Seil dient dabei meist nur als Zwischenschritt vor einer folgenden Sprungtechnik.' },
    { id:'seated_senton', name:'Seated Senton', category:'turnbuckle', tier:'basic', risk:'low', desc:'Der Angreifer springt rückwärts ab und landet im Sitzen auf dem liegenden Gegner. Statt mit dem Rücken zu landen, trifft der Angreifer den Gegner dabei im Sitzen mit dem Gesäß.' },
    { id:'senton_bomb', name:'Senton Bomb', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Ein rückwärtiger Sprung von der obersten Ringecke, bei dem der Angreifer mit dem Rücken auf dem Gegner landet. Die Absprunghöhe der Ringecke macht diese Variante intensiver als einen Senton Splash von den mittleren Seilen.' },
    { id:'senton_splash', name:'Senton Splash', category:'turnbuckle', tier:'basic', risk:'moderate', desc:'Der Angreifer springt rückwärts ab und landet mit dem Rücken auf dem liegenden Gegner. Der Angreifer stößt sich dabei rückwärts von den Seilen ab, statt sich wie beim Moonsault während des Sprungs zu drehen.' },
    { id:'splash', name:'Splash', category:'turnbuckle', tier:'basic', risk:'low', desc:'Der Angreifer springt von den Seilen ab und landet mit dem Bauch auf dem liegenden Gegner. Die Aktion gilt als eine der grundlegendsten Sprungtechniken vom mittleren Seilstrang.' },
    { id:'450_splash', name:'450° Splash', category:'turnbuckle', tier:'finisher', risk:'high', desc:'Eine Salto-Variante mit anderthalb Drehungen, bevor der Angreifer quer auf dem liegenden Gegner landet. Die anderthalb Rotationen erfordern beim Absprung von der Ringecke präzises Timing, damit der Angreifer korrekt auf dem Gegner landet.' },
    { id:'630_splash', name:'630° Splash', category:'turnbuckle', tier:'finisher', risk:'high', desc:'Eine noch weiter gedrehte Splash-Variante mit mehr als anderthalb Rotationen vor der Landung. Durch die zusätzliche Drehung im Vergleich zum 450°-Splash zählt diese Variante zu den technisch anspruchsvollsten Sprungtechniken überhaupt.' },
    { id:'corner_slingshot_splash', name:'Corner Slingshot Splash', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Der Angreifer lässt sich von den mittleren Seilen aus in Richtung Ringecke katapultieren, um dort einen Splash anzusetzen. Ein Partner oder die eigene Sprungtechnik von den Seilen sorgt dabei für den nötigen Schwung in Richtung der Ringecke.' },
    { id:'frog_splash', name:'Frog Splash', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Eine Splash-Variante mit angezogenen Beinen, die sich erst kurz vor dem Aufprall streckt. Die angezogene Haltung während des Sprungs erinnert optisch an einen Frosch, bevor sich der Körper knapp vor der Landung streckt.' },
    { id:'shooting_star_press', name:'Shooting Star Press', category:'turnbuckle', tier:'finisher', risk:'high', desc:'Eine rückwärts rotierende Sprungvariante von der obersten Ringecke, bei der der Angreifer mit der Brust zuerst landet. Anders als beim Moonsault dreht sich der Angreifer dabei mit dem Gesicht zum Ring, was die Aktion optisch und technisch anspruchsvoller macht.' },
    { id:'sunset_flip', name:'Sunset Flip', category:'turnbuckle', tier:'basic', risk:'low', desc:'Der Angreifer rollt sich hinter dem Gegner hindurch und zieht ihn in einen Rückwärts-Pinversuch. Aus der Rolle heraus greift der Angreifer die Beine oder Hüfte des Gegners, um ihn direkt in eine Pinposition zu ziehen.' },
    { id:'whisper_in_the_wind', name:'Whisper in the Wind', category:'turnbuckle', tier:'signature', risk:'moderate', desc:'Der Angreifer springt von den Seilen ab, dreht sich in der Luft um 180 Grad und trifft den Gegner mit dem Fuß an der Schulter. Die Drehung in der Luft macht die Aktion zu einer der akrobatischeren Varianten unter den Sprungtechniken.' },
    { id:'bell_clap', name:'Bell Clap', category:'schlaege', tier:'basic', risk:'moderate', desc:'Mit beiden flachen Händen wird gleichzeitig seitlich auf die Ohren des Gegners geschlagen. Der beidseitige Treffer auf die Ohren kann kurzzeitig das Gleichgewicht und die Orientierung des Gegners stören.' },
    { id:'bionic_elbow', name:'Bionic Elbow', category:'schlaege', tier:'basic', risk:'low', desc:'Ein kraftvoller Schlag mit dem Ellenbogen gegen den Kopf des Gegners. Der Ellenbogen bietet dabei eine härtere Trefferfläche als ein gewöhnlicher Faustschlag.' },
    { id:'chop', name:'Chop', category:'schlaege', tier:'basic', risk:'low', desc:'Ein Handkantenschlag quer über die Brust des Gegners, der vor allem durch sein lautes Geräusch wirkt. Der flache Treffer mit der offenen Hand erzeugt beim Aufprall auf der Brust einen besonders lauten Knall.' },
    { id:'clothesline', name:'Clothesline', category:'schlaege', tier:'basic', risk:'low', desc:'Eine laufende Aktion, bei der ein ausgestreckter Arm den Gegner quer über Brust oder Hals trifft. Der Angreifer nimmt dabei meist Anlauf, um den ausgestreckten Arm mit möglichst viel Schwung auf den Gegner treffen zu lassen.' },
    { id:'double_axe_handle', name:'Double Axe Handle', category:'schlaege', tier:'basic', risk:'low', desc:'Beide zu Fäusten geballten Hände werden von oben wie eine Axt auf den Gegner niedergeschlagen. Die Aktion kann sowohl aus dem Stand als auch nach einem Sprung von den Seilen ausgeführt werden.' },
    { id:'eye_poke', name:'Eye Poke', category:'schlaege', tier:'basic', risk:'low', desc:'Ein Stoß mit den Fingern in Richtung der Augen des Gegners, meist als regelwidrige Aktion. Da die Aktion gegen die Regeln verstößt, wird sie meist verdeckt oder hinter dem Rücken des Schiedsrichters ausgeführt.' },
    { id:'elbow_smash', name:'Elbow Smash', category:'schlaege', tier:'basic', risk:'low', desc:'Ein gerader Schlag mit dem Ellenbogen gegen den Kopf oder Oberkörper des Gegners. Anders als beim Bionic Elbow wird der Ellenbogen dabei meist aus kurzer Distanz frontal eingesetzt.' },
    { id:'hip_attack', name:'Hip Attack', category:'schlaege', tier:'basic', risk:'low', desc:'Der Angreifer rammt den in der Ringecke oder an den Seilen stehenden Gegner mit der Hüfte. Der Angreifer nimmt dabei oft seitlich Anlauf, um mit möglichst viel Schwung in die Hüfte des Gegners zu treffen.' },
    { id:'lariat', name:'Lariat', category:'schlaege', tier:'signature', risk:'moderate', desc:'Eine besonders kraftvolle Clothesline-Variante, oft mit vorherigem Anlauf oder Drehung ausgeführt. Der ausgestreckte Arm wird dabei mit deutlich mehr Kraft und Körpereinsatz geführt als bei einer gewöhnlichen Clothesline.' },
    { id:'low_blow', name:'Low Blow', category:'schlaege', tier:'basic', risk:'low', desc:'Ein regelwidriger Schlag in den Unterleib des Gegners. Die Aktion wird meist genutzt, um einen überlegenen Gegner kurzzeitig handlungsunfähig zu machen.' },
    { id:'punch', name:'Punch', category:'schlaege', tier:'basic', risk:'low', desc:'Ein einfacher Faustschlag gegen den Kopf oder Oberkörper des Gegners. Die Aktion gehört zu den grundlegendsten Angriffstechniken im Wrestling überhaupt.' },
    { id:'samoan_spike', name:'Samoan Spike', category:'schlaege', tier:'finisher', risk:'moderate', desc:'Ein gezielter Stoß mit den gestreckten Fingern gegen die Kehle des Gegners. Die gestreckten Finger treffen dabei präzise den Kehlkopfbereich, was der Aktion ihre besondere Wirkung verleiht.' },
    { id:'shoulder_block', name:'Shoulder Block', category:'schlaege', tier:'basic', risk:'low', desc:'Der Angreifer rammt den Gegner im Anlauf mit der Schulter. Die Aktion wird oft genutzt, um in einem Kräftemessen zu testen, welcher der beiden Wrestler stehen bleibt.' },
    { id:'uppercut', name:'Uppercut', category:'schlaege', tier:'basic', risk:'low', desc:'Ein von unten geführter Schlag, der den Gegner am Kinn trifft. Die Aufwärtsbewegung der Faust sorgt dafür, dass der Kopf des Gegners beim Treffer nach hinten kippt.' },
    { id:'weapon_shot', name:'Weapon Shot', category:'schlaege', tier:'signature', risk:'moderate', desc:'Ein Schlag mit einem Gegenstand, der außerhalb des regulären Regelwerks eingesetzt wird. Je nach verwendetem Gegenstand kann die Aktion von einem einfachen Stoß bis zu einem harten Schlag reichen.' },
    { id:'big_boot', name:'Big Boot', category:'kicks', tier:'basic', risk:'low', desc:'Ein gestreckter Tritt, der den heranlaufenden Gegner mit der Stiefelsohle im Gesicht trifft. Der Angreifer streckt das Bein dabei möglichst hoch und gerade aus, um den Gegner frontal zu treffen.' },
    { id:'dropkick', name:'Dropkick', category:'kicks', tier:'basic', risk:'low', desc:'Der Angreifer springt und streckt beide Füße in Richtung des Gegners. Während des Sprungs befindet sich der Angreifer kurzzeitig komplett in der Luft, bevor beide Füße gleichzeitig auf den Gegner treffen.' },
    { id:'baseball_slide', name:'Baseball Slide', category:'kicks', tier:'basic', risk:'low', desc:'Der Angreifer gleitet mit beiden Füßen voran unter dem untersten Seilstrang hindurch gegen einen außerhalb stehenden Gegner. Die gleitende Bewegung über die Matte erinnert dabei an ein Base-Stealing-Manöver im Baseball, was der Aktion ihren Namen gibt.' },
    { id:'enzuigiri', name:'Enzuigiri', category:'kicks', tier:'signature', risk:'moderate', desc:'Eine Drehkick-Aktion, die den Gegner am Hinterkopf trifft, meist während dieser nach vorne gebeugt steht. Der Angreifer dreht sich dabei in der Luft, sodass die Ferse des Fußes den Hinterkopf des Gegners trifft.' },
    { id:'missile_dropkick', name:'Missile Dropkick', category:'kicks', tier:'signature', risk:'moderate', desc:'Ein Dropkick, der von der obersten Ringecke statt aus dem Stand ausgeführt wird. Die zusätzliche Absprunghöhe der Ringecke sorgt für deutlich mehr Wucht als bei einem gewöhnlichen Dropkick.' },
    { id:'low_kick', name:'Low Kick', category:'kicks', tier:'basic', risk:'low', desc:'Ein Tritt, der auf die Beine des Gegners zielt, um dessen Stand zu destabilisieren. Wiederholte Tritte auf dieselbe Stelle können die Beweglichkeit des Gegners im Laufe des Matches zunehmend einschränken.' },
    { id:'tiger_feint_kick', name:'Tiger Feint Kick', category:'kicks', tier:'signature', risk:'low', desc:'Ein Täuschungstritt, der einen direkten Treffer vortäuscht, bevor der eigentliche Angriff folgt. Der scheinbare Tritt dient dabei vor allem dazu, den Gegner kurz abzulenken oder zum Zurückweichen zu bewegen.' },
    { id:'superkick', name:'Superkick', category:'kicks', tier:'signature', risk:'moderate', desc:'Ein Tritt mit der Stiefelsohle, der den Gegner aus kurzer Distanz im Gesicht trifft. Der Angreifer holt das Bein dabei aus einer engen Standposition heraus mit voller Wucht nach oben.' },
    { id:'backbreaker_hold_combination', name:'Backbreaker Hold Combination', category:'doubleteam', tier:'signature', risk:'moderate', desc:'Ein Wrestler hält den Gegner über dem eigenen Knie, während der Partner von den Seilen kommend Ellenbogen oder Bein auf den Kopf des Gegners treffen lässt. Der haltende Partner sorgt dabei dafür, dass der Gegner während des gesamten Ablaufs bewegungsunfähig bleibt.' },
    { id:'double_suplex', name:'Double Suplex', category:'doubleteam', tier:'signature', risk:'moderate', desc:'Zwei Wrestler heben den Gegner gemeinsam für einen gleichzeitig ausgeführten Suplex an. Durch die gemeinsame Kraft beider Partner kann der Gegner deutlich höher angehoben werden als bei einem Suplex durch einen einzelnen Wrestler.' },
    { id:'dudley_death_drop_3d', name:'Dudley Death Drop (3D)', category:'doubleteam', tier:'finisher', risk:'high', desc:'Ein Partner hält den Gegner fest, während der andere von den Seilen kommend eine Clothesline oder einen weiteren Treffer setzt. Die Kombination aus Festhalten und Sprungangriff macht ein Ausweichen für den Gegner nahezu unmöglich.' },
    { id:'doomsday_device', name:'Doomsday Device', category:'doubleteam', tier:'finisher', risk:'high', desc:'Ein Wrestler hält den Gegner auf den Schultern, während der Partner von der obersten Ringecke einen Angriff auf ihn ausführt. Der Gegner befindet sich dabei hilflos in erhöhter Position, während der zweite Partner von oben trifft.' },
    { id:'event_omega', name:'Event Omega', category:'doubleteam', tier:'finisher', risk:'high', desc:'Eine mehrstufige Double-Team-Kombination, die mehrere Aktionen beider Partner nacheinander verbindet. Durch die Aneinanderreihung mehrerer Techniken bleibt dem Gegner zwischen den einzelnen Treffern kaum Zeit zur Erholung.' },
    { id:'g9', name:'G9', category:'doubleteam', tier:'finisher', risk:'high', desc:'Eine Double-Team-Kombination, bei der beide Partner nacheinander Wurftechniken auf denselben Gegner ausführen. Der Gegner wird dabei von einem Wurf direkt in den nächsten übergeleitet, ohne sich dazwischen erholen zu können.' },
    { id:'hart_attack', name:'Hart Attack', category:'doubleteam', tier:'finisher', risk:'moderate', desc:'Ein Partner hält den Gegner fest, während der andere eine Sprungtechnik gegen ihn ausführt. Das Festhalten sorgt dafür, dass der Gegner die anschließende Sprungtechnik nicht mehr abwehren kann.' },
    { id:'hi_low', name:'Hi-Low', category:'doubleteam', tier:'signature', risk:'moderate', desc:'Ein Partner greift den Gegner tief an, während der andere gleichzeitig hoch am Kopf oder Oberkörper trifft. Durch die gleichzeitigen Treffer an Ober- und Unterkörper hat der Gegner keine Möglichkeit, sich auf einen einzelnen Angriff zu konzentrieren.' },
    { id:'leapfrog_body_guillotine', name:'Leapfrog Body Guillotine', category:'doubleteam', tier:'signature', risk:'moderate', desc:'Ein Partner hält den Kopf des Gegners fest, während der andere über beide hinwegspringt und dabei den Hals des Gegners trifft. Der Sprung über den festgehaltenen Gegner hinweg sorgt für den entscheidenden Treffer am Hals.' },
    { id:'mase', name:'Mase', category:'doubleteam', tier:'finisher', risk:'high', desc:'Eine Double-Team-Kombination aus Halte- und Sprungtechnik beider Partner. Ein Partner bereitet dabei die Position des Gegners vor, während der andere die abschließende Sprungtechnik ausführt.' },
    { id:'poetry_in_motion', name:'Poetry in Motion', category:'doubleteam', tier:'signature', risk:'moderate', desc:'Ein Partner katapultiert den anderen von den Seilen aus gegen einen in der Ringecke sitzenden Gegner. Der katapultierte Partner nutzt dabei den Schwung, um mit einem Tritt oder Sprung in der Ringecke zu treffen.' },
    { id:'spanish_fly', name:'Spanish Fly', category:'doubleteam', tier:'finisher', risk:'high', desc:'Ein Partner hebt den Gegner von der obersten Ringecke, während der andere die Landung absichert. Die Aktion kombiniert eine Wurftechnik aus großer Höhe mit der Unterstützung eines zweiten Partners bei der Landung.' },
    { id:'wishbone', name:'Wishbone', category:'doubleteam', tier:'signature', risk:'moderate', desc:'Beide Partner ziehen die Beine des Gegners gleichzeitig in entgegengesetzte Richtungen. Der gegenläufige Zug an beiden Beinen setzt Hüfte und untere Wirbelsäule des Gegners gleichzeitig unter Spannung.' },
    { id:'snapshot', name:'Snapshot', category:'doubleteam', tier:'finisher', risk:'moderate', desc:'Ein Partner hält den Gegner fest, während der andere aus dem Sprung einen Neckbreaker oder ähnlichen Treffer setzt. Das Festhalten durch den ersten Partner sorgt dafür, dass der Gegner in der richtigen Position für den Treffer des zweiten Partners steht.' },
    { id:'total_elimination', name:'Total Elimination', category:'doubleteam', tier:'finisher', risk:'high', desc:'Eine Double-Team-Kombination, bei der beide Partner gleichzeitig auf den Gegner einwirken, um ihn kraftvoll zu Boden zu bringen. Durch das gleichzeitige Einwirken beider Partner kann der Gegner die Aktion kaum vorhersehen oder abwehren.' },
    { id:'high_angle_superplex', name:'High Angle Superplex', category:'doubleteam', tier:'finisher', risk:'high', desc:'Ein Partner hebt den Gegner von der obersten Ringecke in einen Suplex, während der andere zusätzlichen Schwung gibt. Die Unterstützung des zweiten Partners ermöglicht einen höheren und weiteren Wurf, als es ein einzelner Wrestler von der Ringecke aus schaffen würde.' },
    { id:'hardy_boy_leg_drop', name:'Hardy Boy Leg Drop', category:'doubleteam', tier:'signature', risk:'moderate', desc:'Ein Partner hält den Gegner fest, während der andere von erhöhter Position einen Legdrop ausführt. Die erhöhte Absprungposition sorgt dabei für mehr Wucht als ein gewöhnlicher Legdrop aus dem Stand.' }
  ];

  var FAV_KEY = 'wwo-favorites-v1';
  function loadFavorites(){
    try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }
    catch(e){ return new Set(); }
  }
  function saveFavorites(set){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(set))); }
    catch(e){ /* Speicher nicht verfügbar, ignorieren */ }
  }
  var favorites = loadFavorites();

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function youtubeSearchUrl(name){
    return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name + ' wrestling move');
  }

  /* ================= COUNTDOWN ================= */
  function renderCountdown(){
    var el = document.getElementById('countdown-badge');
    if(!el) return;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var target = new Date(now.getFullYear(), 10, 14); // 14. November
    if(target < today){ target = new Date(now.getFullYear() + 1, 10, 14); }
    var days = Math.round((target - today) / 86400000);
    var text = days === 0 ? 'Heute ist die Show!' : (days + (days === 1 ? ' Tag bis zur Show' : ' Tage bis zur Show'));
    el.textContent = text;
  }
  renderCountdown();

  function buildCategoryChips(container, stateSet, onChange){
    container.innerHTML = '';
    Object.keys(CATEGORIES).forEach(function(key){
      var cat = CATEGORIES[key];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (stateSet.has(key) ? ' active' : '');
      btn.style.setProperty('--chip-color', cat.color);
      btn.textContent = cat.label;
      btn.setAttribute('aria-pressed', stateSet.has(key) ? 'true' : 'false');
      btn.addEventListener('click', function(){
        if(stateSet.has(key)){ stateSet.delete(key); } else { stateSet.add(key); }
        btn.classList.toggle('active');
        btn.setAttribute('aria-pressed', stateSet.has(key) ? 'true' : 'false');
        onChange();
      });
      container.appendChild(btn);
    });
  }

  /* ================= ARCHIV ================= */
  var archiveState = {
    search: '',
    categories: new Set(Object.keys(CATEGORIES)),
    tiers: new Set(['basic','signature','finisher']),
    risks: new Set(['low','moderate','high']),
    favoritesOnly: false
  };

  var archiveGrid = document.getElementById('archive-grid');
  var archiveCount = document.getElementById('archive-count');
  var searchInput = document.getElementById('move-search');
