  function renderArchive(){
    var q = archiveState.search.trim().toLowerCase();
    var results = MOVES.filter(function(m){
      if(!archiveState.categories.has(m.category)) return false;
      if(!archiveState.tiers.has(m.tier)) return false;
      if(!archiveState.risks.has(m.risk)) return false;
      if(archiveState.favoritesOnly && !favorites.has(m.id)) return false;
      if(q && m.name.toLowerCase().indexOf(q) === -1 && m.desc.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    archiveCount.textContent = results.length + (results.length === 1 ? ' Technik' : ' Techniken');
    archiveGrid.innerHTML = results.map(function(m){
      var cat = CATEGORIES[m.category];
      var starred = favorites.has(m.id);
      return '' +
        '<article class="move-card" style="--card-accent:' + cat.color + '">' +
          '<div class="move-card-bar"></div>' +
          '<div class="move-card-body">' +
            '<div class="move-card-head">' +
              '<h3>' + escapeHtml(m.name) + '</h3>' +
              '<button class="fav-btn' + (starred ? ' active' : '') + '" data-id="' + m.id + '" aria-pressed="' + starred + '" aria-label="' + escapeHtml(m.name) + ' zu Favoriten hinzufügen">' + (starred ? '\u2605' : '\u2606') + '</button>' +
            '</div>' +
            '<div class="move-card-tags">' +
              '<span class="tag cat-tag" style="--tag-color:' + cat.color + '">' + cat.label + '</span>' +
              '<span class="tag tier-tag">' + TIER_LABELS[m.tier] + '</span>' +
              '<span class="tag risk-' + m.risk + '">' + RISK_LABELS[m.risk] + '</span>' +
            '</div>' +
            '<p>' + escapeHtml(m.desc) + '</p>' +
            '<a class="watch-link" href="' + youtubeSearchUrl(m.name) + '" target="_blank" rel="noopener">Video suchen \u2197</a>' +
          '</div>' +
        '</article>';
    }).join('');
    Array.prototype.forEach.call(archiveGrid.querySelectorAll('.fav-btn'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.id;
        if(favorites.has(id)){ favorites.delete(id); } else { favorites.add(id); }
        saveFavorites(favorites);
        renderArchive();
      });
    });
  }

  searchInput.addEventListener('input', function(e){
    archiveState.search = e.target.value;
    renderArchive();
  });
  buildCategoryChips(document.getElementById('archive-cat-chips'), archiveState.categories, renderArchive);
  Array.prototype.forEach.call(document.querySelectorAll('#archive-tier-chips [data-tier]'), function(btn){
    btn.addEventListener('click', function(){
      var tier = btn.dataset.tier;
      if(archiveState.tiers.has(tier)){ archiveState.tiers.delete(tier); } else { archiveState.tiers.add(tier); }
      btn.classList.toggle('active');
      btn.setAttribute('aria-pressed', archiveState.tiers.has(tier) ? 'true' : 'false');
      renderArchive();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#archive-risk-chips [data-risk]'), function(btn){
    btn.addEventListener('click', function(){
      var risk = btn.dataset.risk;
      if(archiveState.risks.has(risk)){ archiveState.risks.delete(risk); } else { archiveState.risks.add(risk); }
      btn.classList.toggle('active');
      btn.setAttribute('aria-pressed', archiveState.risks.has(risk) ? 'true' : 'false');
      renderArchive();
    });
  });
  document.getElementById('fav-only-toggle').addEventListener('change', function(e){
    archiveState.favoritesOnly = e.target.checked;
    renderArchive();
  });
  renderArchive();

  /* ================= GENERATOR ================= */
  var genState = {
    categories: new Set(Object.keys(CATEGORIES)),
    risk: new Set(['low','moderate']),
    wrestlerCount: 2,
    wrestlers: [
      { name:'Wrestler A', archetype:'zufall' },
      { name:'Wrestler B', archetype:'zufall' }
    ],
    stipulation: 'zufall'
  };

  buildCategoryChips(document.getElementById('gen-cat-chips'), genState.categories, function(){});
  Array.prototype.forEach.call(document.querySelectorAll('#gen-risk-chips [data-risk]'), function(btn){
    btn.addEventListener('click', function(){
      var risk = btn.dataset.risk;
      if(genState.risk.has(risk)){ genState.risk.delete(risk); } else { genState.risk.add(risk); }
      btn.classList.toggle('active');
      btn.setAttribute('aria-pressed', genState.risk.has(risk) ? 'true' : 'false');
    });
  });

  var wrestlerCountSelect = document.getElementById('wrestler-count');
  var wrestlerFields = document.getElementById('wrestler-fields');
  var stipulationSelect = document.getElementById('stipulation-select');

  stipulationSelect.innerHTML = '<option value="zufall">Überrasch mich</option>' +
    STIPULATIONS.map(function(s){ return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join('');
  stipulationSelect.addEventListener('change', function(e){ genState.stipulation = e.target.value; });

  function renderWrestlerFields(){
    while(genState.wrestlers.length < genState.wrestlerCount){
      var idx = genState.wrestlers.length;
      genState.wrestlers.push({ name:'Wrestler ' + String.fromCharCode(65 + idx), archetype:'zufall' });
    }
    genState.wrestlers = genState.wrestlers.slice(0, genState.wrestlerCount);

    wrestlerFields.innerHTML = genState.wrestlers.map(function(w, i){
      var options = '<option value="zufall"' + (w.archetype === 'zufall' ? ' selected' : '') + '>Zufällig</option>';
      Object.keys(ARCHETYPES).forEach(function(k){
        options += '<option value="' + k + '"' + (w.archetype === k ? ' selected' : '') + '>' + ARCHETYPES[k].label + '</option>';
      });
      return '' +
        '<div class="wrestler-field">' +
          '<label>Name Wrestler ' + (i + 1) +
            '<input type="text" data-idx="' + i + '" class="wrestler-name" value="' + escapeHtml(w.name) + '" maxlength="40">' +
          '</label>' +
          '<label>Stil' +
            '<select data-idx="' + i + '" class="wrestler-archetype">' + options + '</select>' +
          '</label>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(wrestlerFields.querySelectorAll('.wrestler-name'), function(inp){
      inp.addEventListener('input', function(){
        var i = +inp.dataset.idx;
        genState.wrestlers[i].name = inp.value || ('Wrestler ' + String.fromCharCode(65 + i));
      });
    });
    Array.prototype.forEach.call(wrestlerFields.querySelectorAll('.wrestler-archetype'), function(sel){
      sel.addEventListener('change', function(){
        genState.wrestlers[+sel.dataset.idx].archetype = sel.value;
      });
    });
  }
  wrestlerCountSelect.addEventListener('change', function(e){
    genState.wrestlerCount = +e.target.value;
    renderWrestlerFields();
  });
  renderWrestlerFields();

  function pickCategory(weights, allowedCats){
    var entries = Object.keys(weights).filter(function(cat){ return allowedCats.has(cat); }).map(function(cat){ return [cat, weights[cat]]; });
    if(!entries.length) return null;
    var total = entries.reduce(function(s, e){ return s + e[1]; }, 0);
    var r = Math.random() * total;
    for(var i = 0; i < entries.length; i++){
      if(r < entries[i][1]) return entries[i][0];
      r -= entries[i][1];
    }
    return entries[entries.length - 1][0];
  }

  function movePool(){
    var pool = MOVES.filter(function(m){ return genState.categories.has(m.category) && genState.risk.has(m.risk); });
    if(!pool.length) pool = MOVES.filter(function(m){ return genState.categories.has(m.category); });
    if(!pool.length) pool = MOVES.slice();
    return pool;
  }

  function pickMove(pool, category, tierPrefs, usedIds){
    var i, c;
    for(i = 0; i < tierPrefs.length; i++){
      c = pool.filter(function(m){ return m.category === category && m.tier === tierPrefs[i] && !usedIds.has(m.id); });
      if(c.length) return c[Math.floor(Math.random() * c.length)];
    }
    c = pool.filter(function(m){ return m.category === category && !usedIds.has(m.id); });
    if(c.length) return c[Math.floor(Math.random() * c.length)];
    for(i = 0; i < tierPrefs.length; i++){
      c = pool.filter(function(m){ return m.tier === tierPrefs[i] && !usedIds.has(m.id); });
      if(c.length) return c[Math.floor(Math.random() * c.length)];
    }
    c = pool.filter(function(m){ return !usedIds.has(m.id); });
    if(c.length) return c[Math.floor(Math.random() * c.length)];
    return null;
  }

  function buildWrestlerCard(w){
    var archKeys = Object.keys(ARCHETYPES);
    var archetypeKey = w.archetype === 'zufall' ? archKeys[Math.floor(Math.random() * archKeys.length)] : w.archetype;
    var archetype = ARCHETYPES[archetypeKey];
    var pool = movePool();
    var allowedCats = genState.categories.size ? genState.categories : new Set(Object.keys(CATEGORIES));
    var allowedList = Array.from(allowedCats);
    var usedIds = new Set();
    var beats = BEATS.map(function(beat){
      var cat = pickCategory(archetype.weights, allowedCats) || allowedList[Math.floor(Math.random() * allowedList.length)];
      var move = pickMove(pool, cat, beat.tierPref, usedIds);
      if(move) usedIds.add(move.id);
      return { beat: beat, move: move };
    });
    return { name: w.name, archetypeLabel: archetype.label, beats: beats };
  }

  var lastCard = null;

  function renderCard(){
    var stip = genState.stipulation === 'zufall'
      ? STIPULATIONS[Math.floor(Math.random() * STIPULATIONS.length)]
      : genState.stipulation;
    var cards = genState.wrestlers.map(buildWrestlerCard);
    lastCard = { stip: stip, cards: cards };
    paintCard();
  }

  function paintCard(){
    if(!lastCard) return;
    var out = document.getElementById('card-output');
    out.innerHTML = '' +
      '<div class="card-stip">' + escapeHtml(lastCard.stip) + '</div>' +
      '<div class="card-columns">' +
        lastCard.cards.map(function(c, ci){
          var beatsHtml = c.beats.map(function(b){
            if(!b.move){
              return '<li><span class="beat-label">' + b.beat.label + '</span><span class="beat-empty">Keine passende Technik bei diesen Filtern</span></li>';
            }
            var cat = CATEGORIES[b.move.category];
            return '' +
              '<li>' +
                '<span class="beat-label">' + b.beat.label + '</span>' +
                '<span class="beat-dot" style="--dot-color:' + cat.color + '"></span>' +
                '<span class="beat-name">' + escapeHtml(b.move.name) + '</span>' +
              '</li>';
          }).join('');
          return '' +
            '<div class="wrestler-column">' +
              '<div class="wrestler-column-head">' +
                '<h3>' + escapeHtml(c.name) + '</h3>' +
                '<span class="archetype-pill">' + escapeHtml(c.archetypeLabel) + '</span>' +
                '<button class="reroll-btn" data-idx="' + ci + '" type="button">Neu würfeln</button>' +
              '</div>' +
              '<ol class="beat-list">' + beatsHtml + '</ol>' +
            '</div>';
        }).join('') +
      '</div>';
    Array.prototype.forEach.call(out.querySelectorAll('.reroll-btn'), function(btn){
      btn.addEventListener('click', function(){
        var idx = +btn.dataset.idx;
        lastCard.cards[idx] = buildWrestlerCard(genState.wrestlers[idx]);
        paintCard();
      });
    });
  }

  document.getElementById('generate-btn').addEventListener('click', renderCard);
  document.getElementById('reroll-all-btn').addEventListener('click', function(){ if(lastCard) renderCard(); });

  document.getElementById('copy-btn').addEventListener('click', function(){
    if(!lastCard){ return; }
    var text = 'WEIRD WRESTLING ORGANIZER \u2014 MATCH-KARTE\n';
    text += 'Stipulation: ' + lastCard.stip + '\n\n';
    lastCard.cards.forEach(function(c){
      text += c.name + ' (' + c.archetypeLabel + ')\n';
      c.beats.forEach(function(b){
        text += '  ' + b.beat.label + ': ' + (b.move ? b.move.name : '\u2014') + '\n';
      });
      text += '\n';
    });
    var btn = document.getElementById('copy-btn');
    var original = btn.textContent;
    function flash(){ btn.textContent = 'Kopiert!'; setTimeout(function(){ btn.textContent = original; }, 1500); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(flash).catch(function(){ window.prompt('Diesen Text kopieren:', text); });
    } else {
      window.prompt('Diesen Text kopieren:', text);
    }
  });

  /* ================= TABS ================= */
  var tabButtons = document.querySelectorAll('.tab-btn');
  var panels = { archive: document.getElementById('panel-archive'), generator: document.getElementById('panel-generator') };
  Array.prototype.forEach.call(tabButtons, function(btn){
    btn.addEventListener('click', function(){
      Array.prototype.forEach.call(tabButtons, function(b){ b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
      btn.classList.add('active');
      btn.setAttribute('aria-selected','true');
      Object.keys(panels).forEach(function(key){
        panels[key].classList.toggle('hidden', key !== btn.dataset.tab);
      });
    });
  });

})();
</script>
</body>
</html>
